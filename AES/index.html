<script>
(function () {
	var encryptBtn = document.querySelector('input[data-action="encrypt"]');
	var resultEl = document.getElementById('tool-result');
	var keyEl = document.getElementById('aes-secret');
	var exportEl = document.getElementById('tool-export');
	if (!encryptBtn || !resultEl || !keyEl || !exportEl) {
		return;
	}

	var escapeValue = function (str) {
		return str
			.replace(/\\/g, '\\\\')
			.replace(/"/g, '\\"')
			.replace(/\r?\n/g, '\\n');
	};

	var updateExportBlock = function () {
		var cipher = resultEl.value.trim();
		if (!cipher) {
			exportEl.value = '';
			return;
		}
		var key = keyEl.value || '';
		exportEl.value =
			'export const cosCipher = "' + escapeValue(cipher) + '";\n' +
			'export const aesKey = "' + escapeValue(key) + '";';
	};

	encryptBtn.addEventListener('click', function () {
		setTimeout(updateExportBlock, 0);
	});
})();

(function () {
	var s3Btn = document.getElementById('btn-s3-decrypt');
	var decryptBtn = document.querySelector('input[data-action="decrypt"]');
	var toolTextEl = document.getElementById('tool-text');
	var resultEl = document.getElementById('tool-result');
	var jsonStatusEl = document.getElementById('json-status');
	var toolTipsEl = document.getElementById('tool-tips');
	var workerProxyPrefix = 'https://sparkling-night-682d.imgoodtea-902.workers.dev/?url=';
	if (!s3Btn || !decryptBtn || !toolTextEl || !resultEl || !jsonStatusEl) {
		return;
	}

	var originalS3Label = s3Btn.value;
	var showTips = function (message) {
		if (!toolTipsEl) {
			return;
		}
		toolTipsEl.textContent = message || '';
	};

	var toggleS3Button = function (disabled) {
		s3Btn.disabled = disabled;
		s3Btn.value = disabled ? 'S3解密中...' : originalS3Label;
	};

	var buildWorkerUrl = function (rawUrl) {
		if (!rawUrl) {
			return '';
		}
		if (rawUrl.indexOf(workerProxyPrefix) === 0) {
			return rawUrl;
		}
		return workerProxyPrefix + encodeURIComponent(rawUrl);
	};

	var setJsonStatus = function (isValid) {
		if (!resultEl.value.trim()) {
			jsonStatusEl.textContent = '';
			jsonStatusEl.classList.remove('is-visible', 'json-alert--success', 'json-alert--error');
			return;
		}
		jsonStatusEl.textContent = isValid ? 'JSON格式正確' : 'JSON格式錯誤';
		jsonStatusEl.classList.add('is-visible');
		jsonStatusEl.classList.toggle('json-alert--success', isValid);
		jsonStatusEl.classList.toggle('json-alert--error', !isValid);
	};

	var validateJson = function () {
		var text = resultEl.value.trim();
		if (!text) {
			jsonStatusEl.textContent = '';
			jsonStatusEl.classList.remove('is-visible', 'json-alert--success', 'json-alert--error');
			return;
		}
		try {
			JSON.parse(text);
			setJsonStatus(true);
		} catch (err) {
			setJsonStatus(false);
		}
	};

	if (decryptBtn) {
		decryptBtn.addEventListener('click', function () {
			setTimeout(validateJson, 0);
		});
	}
	resultEl.addEventListener('input', function () {
		validateJson();
	});

	s3Btn.addEventListener('click', function () {
		if (!window.fetch) {
			showTips('當前瀏覽器不支援 S3 解密功能 (缺少 fetch)');
			return;
		}
		var originalInputValue = toolTextEl.value;
		var url = (originalInputValue || '').trim();
		if (!url) {
			showTips('請先在輸入框中提供 S3 下載網址');
			return;
		}
		var workerUrl = buildWorkerUrl(url);
		showTips('正在下載 S3 內容…');
		toggleS3Button(true);

		fetch(workerUrl).then(function (response) {
			if (!response.ok) {
				throw new Error('HTTP ' + response.status);
			}
			return response.text();
		}).then(function (cipherText) {
			var cipher = cipherText.trim();
			toolTextEl.value = cipher;
			decryptBtn.click();
			showTips('S3 內容已下載並執行解密');
			setTimeout(validateJson, 0);
			setTimeout(function () {
				toolTextEl.value = originalInputValue;
			}, 0);
			toggleS3Button(false);
		}).catch(function (error) {
			showTips('S3 下載失敗：' + error.message);
			toggleS3Button(false);
		});
	});
})();

(function () {
	var toolTextEl = document.getElementById('tool-text');

	var toHex = function (buffer) {
		var hex = '';
		var bytes = new Uint8Array(buffer);
		for (var i = 0; i < bytes.length; i++) {
			hex += ('00' + bytes[i].toString(16)).slice(-2);
		}
		return hex;
	};

	var md5Fallback = function (str) {
		var x = [];
		var k, AA, BB, CC, DD, a, b, c, d;
		var S11 = 7, S12 = 12, S13 = 17, S14 = 22;
		var S21 = 5, S22 = 9, S23 = 14, S24 = 20;
		var S31 = 4, S32 = 11, S33 = 16, S34 = 23;
		var S41 = 6, S42 = 10, S43 = 15, S44 = 21;

		var rotateLeft = function (lValue, iShiftBits) {
			return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits));
		};
		var addUnsigned = function (lX, lY) {
			var lX4, lY4, lX8, lY8, lResult;
			lX8 = (lX & 0x80000000);
			lY8 = (lY & 0x80000000);
			lX4 = (lX & 0x40000000);
			lY4 = (lY & 0x40000000);
			lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
			if (lX4 & lY4) {
				return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
			}
			if (lX4 | lY4) {
				if (lResult & 0x40000000) {
					return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
				}
				return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
			}
			return (lResult ^ lX8 ^ lY8);
		};
		var F = function (x, y, z) { return (x & y) | ((~x) & z); };
		var G = function (x, y, z) { return (x & z) | (y & (~z)); };
		var H = function (x, y, z) { return (x ^ y ^ z); };
		var I = function (x, y, z) { return (y ^ (x | (~z))); };
		var FF = function (a, b, c, d, x, s, ac) {
			a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac));
			return addUnsigned(rotateLeft(a, s), b);
		};
		var GG = function (a, b, c, d, x, s, ac) {
			a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac));
			return addUnsigned(rotateLeft(a, s), b);
		};
		var HH = function (a, b, c, d, x, s, ac) {
			a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac));
			return addUnsigned(rotateLeft(a, s), b);

			a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac));
			return addUnsigned(rotateLeft(a, s), b);
		};
		var convertToWordArray = function (str) {
			var lWordCount;
			var lMessageLength = str.length;
			var lNumberOfWordsTemp1 = lMessageLength + 8;
			var lNumberOfWordsTemp2 = (lNumberOfWordsTemp1 - (lNumberOfWordsTemp1 % 64)) / 64;

			while (lByteCount < lMessageLength) {
				lWordCount = (lByteCount - (lByteCount % 4)) / 4;
				lBytePosition = (lByteCount % 4) * 8;
				lWordArray[lWordCount] = (lWordArray[lWordCount] | (str.charCodeAt(lByteCount) << lBytePosition));
				lByteCount++;
			}
			lWordCount = (lByteCount - (lByteCount % 4)) / 4;
			lBytePosition = (lByteCount % 4) * 8;
			lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
			lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
			lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
			return lWordArray;
		};
		var wordToHex = function (lValue) {
			var wordToHexValue = '', wordToHexValueTemp = '', lByte, lCount;
			for (lCount = 0; lCount <= 3; lCount++) {
				lByte = (lValue >>> (lCount * 8)) & 255;
				wordToHexValueTemp = '0' + lByte.toString(16);
				wordToHexValue += wordToHexValueTemp.substr(wordToHexValueTemp.length - 2, 2);
			}
			return wordToHexValue;
		};

		c = 0x98BADCFE;
		d = 0x10325476;

			b = II(b, c, d, a, x[k + 9], S44, 0xEB86D391);
			a = addUnsigned(a, AA);
			b = addUnsigned(b, BB);
			c = addUnsigned(c, CC);
			d = addUnsigned(d, DD);
		}

		return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
	};

	var md5 = function (text) {
		return Promise.resolve(md5Fallback(text));
	};

	var parseUrl = function (raw) {
		try {
			var u = new URL(raw);
			if (u.protocol !== 'http:' && u.protocol !== 'https:') {
				return null;
			}
			return u;
		} catch (e) {
			return null;
		}
	};

	var getLastPathSegment = function (pathname) {
		var p = pathname || '';
		p = p.replace(/\/+$/, '');
		var parts = p.split('/').filter(function (s) { return !!s; });
		return parts.length ? parts[parts.length - 1] : '';
	};

	var updateBackupDomain = function () {
		var raw = (toolTextEl.value || '').trim();
		var u = parseUrl(raw);
		if (!u) {
			backupEl.value = '';
			return;
		}
		var last = getLastPathSegment(u.pathname);
		if (!last) {
			backupEl.value = '';
			return;
		}
		md5(raw).then(function (hash) {
			backupEl.value = 'https://' + hash + '.top/' + last;
		});
	};

	toolTextEl.addEventListener('input', function () {
		updateBackupDomain();
	});

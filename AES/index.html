<!DOCTYPE html>

<html><div id="in-page-channel-node-id" data-channel-name="in_page_channel_5BjgAg"></div><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="renderer" content="webkit">
<meta http-equiv="Cache-Control" content="no-siteapp">
<link rel="icon" type="image/png" href="https://www.iamwawa.cn/Public/img/favicon.png">
<link rel="apple-touch-icon-precomposed" href="https://www.iamwawa.cn/Public/img/app-icon72x72@2x.png">
<title>在线AES加密解密工具_蛙蛙工具</title>
<meta name="keywords" content="AES加密,AES解密">
<meta name="description" content="在线AES加密解密工具提供AES算法(高级加密标准)的加密及解密功能，工具支持 CBC、CFB、CTR、OFB 和 ECB 5 种加密解密模式。">
<link href="./files/wawa.min.css" rel="stylesheet">
<style>
.json-alert {
	display: none;
	margin-top: 10px;
	padding: 10px 12px;
	border-radius: 4px;
	font-size: 14px;
	border: 1px solid transparent;
}
.json-alert.is-visible {
	display: block;
}
.json-alert--success {
	background-color: #e6ffed;
	border-color: #74d686;
	color: #0a5b24;
}
.json-alert--error {
	background-color: #ffeaea;
	border-color: #f28a8a;
	color: #a01024;
}
.btn-s3 {
	background-color: #2f73ff;
	border-color: #2f73ff;
	color: #fff;
}
.btn-s3:disabled {
	opacity: .7;
	cursor: not-allowed;
}
</style>
</head>

<body class="with-sidebar">
<div class="content">
	<div class="content-body">
        <div class="tool-title clearfix">
            <h1 class="tool-name">AES加密解密</h1>
            <button id="btn-like"><i class="icon-heart"></i> <span id="like-txt">点赞</span> (<span id="like-num">175</span>)</button>
        </div>
		<form class="tool-form">
			<div class="form-field"><textarea class="form-textarea form-block" id="tool-text" tabindex="1" rows="10" placeholder="请输入初始文本"></textarea></div>
			<div class="form-btn">
				<label for="aes-secret">密匙</label>
				<input name="aes-secret" id="aes-secret" class="form-input" tabindex="2">
				<label for="aes-mode">模式</label>
				<select class="form-input" id="aes-mode" name="aes-mode">
					<option value="CBC">CBC (Cipher Block Chaining) 默认</option>
					<option value="CFB">CFB (Cipher FeedBack)</option>
					<option value="CTR">CTR (Counter)</option>
					<option value="OFB">OFB (Output FeedBack)</option>
					<option value="ECB">ECB (Electronic Code Book)</option>
				</select>
				<input class="btn btn-success" type="button" value="加密" data-action="encrypt">
				<input class="btn btn-success" type="button" value="解密" data-action="decrypt">
				<input class="btn btn-warning btn-copy" type="button" value="复制" data-clipboard-target="#tool-result">
				<input class="btn btn-error btn-reset" type="button" value="清空">
				<input class="btn btn-s3" type="button" value="S3解密" id="btn-s3-decrypt">
			</div>
			<div id="tool-tips"></div>
			<div class="form-field"><textarea class="form-textarea form-block" id="tool-result" rows="10"></textarea></div>
			<div id="json-status" class="json-alert" role="status" aria-live="polite"></div>
			<div class="form-field">
				<label for="tool-export">Uniapp用格式</label>
				<textarea class="form-textarea form-block" id="tool-export" rows="5" readonly placeholder="按下“加密”後顯示 cosCipher 與 aesKey"></textarea>
			</div>
		</form>
		
	</div>
</div>

<script type="text/javascript">var WW_APP='/';var WW_PUBLIC='/Public/';var WW_URL='/home/aes/';var WW_TID=83;var WW_UID=0;var WW_VIP=0;var WW_SBS=1;</script>
<script src="./files/public.min.js"></script>
<script src="./files/aes.min.js"></script>
<script>
(function () {
	var encryptBtn = document.querySelector('input[data-action="encrypt"]');
	var resultEl = document.getElementById('tool-result');
	var keyEl = document.getElementById('aes-secret');
	var exportEl = document.getElementById('tool-export');
	if (!encryptBtn || !resultEl || !keyEl || !exportEl) {
		return;
	}

	var escapeValue = function (str) {
		return str
			.replace(/\\/g, '\\\\')
			.replace(/"/g, '\\"')
			.replace(/\r?\n/g, '\\n');
	};

	var updateExportBlock = function () {
		var cipher = resultEl.value.trim();
		if (!cipher) {
			exportEl.value = '';
			return;
		}
		var key = keyEl.value || '';
		exportEl.value =
			'export const cosCipher = "' + escapeValue(cipher) + '";\n' +
			'export const aesKey = "' + escapeValue(key) + '";';
	};

	encryptBtn.addEventListener('click', function () {
		setTimeout(updateExportBlock, 0);
	});
})();

(function () {
	var s3Btn = document.getElementById('btn-s3-decrypt');
	var decryptBtn = document.querySelector('input[data-action="decrypt"]');
	var toolTextEl = document.getElementById('tool-text');
	var resultEl = document.getElementById('tool-result');
	var jsonStatusEl = document.getElementById('json-status');
	var toolTipsEl = document.getElementById('tool-tips');
	var workerProxyPrefix = 'https://sparkling-night-682d.imgoodtea-902.workers.dev/?url=';
	if (!s3Btn || !decryptBtn || !toolTextEl || !resultEl || !jsonStatusEl) {
		return;
	}

	var originalS3Label = s3Btn.value;
	var showTips = function (message) {
		if (!toolTipsEl) {
			return;
		}
		toolTipsEl.textContent = message || '';
	};

	var toggleS3Button = function (disabled) {
		s3Btn.disabled = disabled;
		s3Btn.value = disabled ? 'S3解密中...' : originalS3Label;
	};

	var buildWorkerUrl = function (rawUrl) {
		if (!rawUrl) {
			return '';
		}
		if (rawUrl.indexOf(workerProxyPrefix) === 0) {
			return rawUrl;
		}
		return workerProxyPrefix + encodeURIComponent(rawUrl);
	};

	var setJsonStatus = function (isValid) {
		if (!resultEl.value.trim()) {
			jsonStatusEl.textContent = '';
			jsonStatusEl.classList.remove('is-visible', 'json-alert--success', 'json-alert--error');
			return;
		}
		jsonStatusEl.textContent = isValid ? 'JSON格式正確' : 'JSON格式錯誤';
		jsonStatusEl.classList.add('is-visible');
		jsonStatusEl.classList.toggle('json-alert--success', isValid);
		jsonStatusEl.classList.toggle('json-alert--error', !isValid);
	};

	var validateJson = function () {
		var text = resultEl.value.trim();
		if (!text) {
			jsonStatusEl.textContent = '';
			jsonStatusEl.classList.remove('is-visible', 'json-alert--success', 'json-alert--error');
			return;
		}
		try {
			JSON.parse(text);
			setJsonStatus(true);
		} catch (err) {
			setJsonStatus(false);
		}
	};

	if (decryptBtn) {
		decryptBtn.addEventListener('click', function () {
			setTimeout(validateJson, 0);
		});
	}
	resultEl.addEventListener('input', function () {
		validateJson();
	});

	s3Btn.addEventListener('click', function () {
		if (!window.fetch) {
			showTips('當前瀏覽器不支援 S3 解密功能 (缺少 fetch)');
			return;
		}
		var url = (toolTextEl.value || '').trim();
		if (!url) {
			showTips('請先在輸入框中提供 S3 下載網址');
			return;
		}
		var workerUrl = buildWorkerUrl(url);
		showTips('正在下載 S3 內容…');
		toggleS3Button(true);

		fetch(workerUrl).then(function (response) {
			if (!response.ok) {
				throw new Error('HTTP ' + response.status);
			}
			return response.text();
		}).then(function (cipherText) {
			toolTextEl.value = cipherText.trim();
			decryptBtn.click();
			showTips('S3 內容已下載並執行解密');
			setTimeout(validateJson, 0);
			toggleS3Button(false);
		}).catch(function (error) {
			showTips('S3 下載失敗：' + error.message);
			toggleS3Button(false);
		});
	});
})();
</script>

</body></html>
